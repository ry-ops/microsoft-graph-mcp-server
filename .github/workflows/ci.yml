name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      # No lockfile exists; dependencies are resolved from pyproject.toml.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip tomli
          python - <<'PY' > /tmp/requirements.txt
          import tomli
          p = tomli.load(open("pyproject.toml", "rb"))["project"]
          print("\n".join(p["dependencies"] + p["optional-dependencies"]["dev"]))
          PY
          python -m pip install -r /tmp/requirements.txt
      - name: Byte-compile
        run: python -m compileall -q mcp_graph_server.py
      - name: Test
        run: python -m pytest -q
