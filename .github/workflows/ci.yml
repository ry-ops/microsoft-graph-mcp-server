name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # No lockfile exists; dependencies are resolved from pyproject.toml.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip tomli
          python - <<'PY' > /tmp/requirements.txt
          import tomli
          p = tomli.load(open("pyproject.toml", "rb"))["project"]
          print("\n".join(p["dependencies"] + p["optional-dependencies"]["dev"]))
          PY
          python -m pip install -r /tmp/requirements.txt
      - name: Byte-compile
        run: python -m compileall -q mcp_graph_server.py
      - name: Test
        run: python -m pytest -q
