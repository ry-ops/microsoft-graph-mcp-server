<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d">
  <title id="t">How the Microsoft Graph MCP server authenticates, and the permissions each tool area needs</title>
  <desc id="d">An Entra ID app registration provides a tenant ID, client ID and client secret. The server uses MSAL's client-credentials flow to get an app-only token and calls Microsoft Graph with it. The 19 tools fall into users (4), licenses (2), groups (4) and SharePoint (9), each needing Graph application permissions, with read-only alternatives; tools marked with a pencil change things.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e6ebf5; }
    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes k1 { 0%,4.00% { transform: translateX(0); opacity: 0; } 5.00% { opacity: 1; } 16.00% { transform: translateX(150px); opacity: 1; } 18.00%,100% { transform: translateX(150px); opacity: 0; } } .k1 { animation: k1 10.0s infinite; }
    @keyframes k2 { 0%,22.00% { transform: translateX(0); opacity: 0; } 23.00% { opacity: 1; } 34.00% { transform: translateX(150px); opacity: 1; } 36.00%,100% { transform: translateX(150px); opacity: 0; } } .k2 { animation: k2 10.0s infinite; }
    @keyframes k3 { 0%,46.00% { transform: translateX(0); opacity: 0; } 47.00% { opacity: 1; } 58.00% { transform: translateX(150px); opacity: 1; } 60.00%,100% { transform: translateX(150px); opacity: 0; } } .k3 { animation: k3 10.0s infinite; }
    @keyframes k4 { 0%,70.00% { transform: translateX(0); opacity: 0; } 71.00% { opacity: 1; } 82.00% { transform: translateX(150px); opacity: 1; } 84.00%,100% { transform: translateX(150px); opacity: 0; } } .k4 { animation: k4 10.0s infinite; }
    @keyframes g0 { 0%,3.00% { opacity: 0; transform: translateY(8px); } 7.00%,95% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } } .g0 { animation: g0 10.0s infinite; }
    @keyframes g1 { 0%,9.00% { opacity: 0; transform: translateY(8px); } 13.00%,95% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } } .g1 { animation: g1 10.0s infinite; }
    @keyframes g2 { 0%,15.00% { opacity: 0; transform: translateY(8px); } 19.00%,95% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } } .g2 { animation: g2 10.0s infinite; }
    @keyframes g3 { 0%,21.00% { opacity: 0; transform: translateY(8px); } 25.00%,95% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } } .g3 { animation: g3 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="960" height="500" rx="20" fill="#0f1420"/>
  <text x="30" y="52" font-size="28" font-weight="800">19 tools · app-only auth</text>
  <text x="30" y="78" font-size="15" class="muted">One Entra app registration. The permissions you grant it decide what the tools can do.</text>

  <rect x="30" y="100" width="210" height="64" rx="12" fill="#161d2b" stroke="#2c3750"/><text x="46" y="124" font-size="13" font-weight="700">Entra app registration</text><text x="46" y="146" font-size="10.5" class="mono muted">tenant · client ID · secret</text>
  <rect x="390" y="100" width="190" height="64" rx="12" fill="#1d2536" stroke="#00a4ef" stroke-width="2"/><text x="485" y="126" text-anchor="middle" font-size="13" font-weight="800">mcp_graph_server.py</text><text x="485" y="146" text-anchor="middle" font-size="10.5" class="muted">MSAL · client credentials</text>
  <rect x="730" y="100" width="200" height="64" rx="12" fill="#161d2b" stroke="#2c3750"/><text x="830" y="126" text-anchor="middle" font-size="13" font-weight="700">Microsoft Graph</text><text x="830" y="146" text-anchor="middle" font-size="10.5" class="mono muted">graph.microsoft.com</text>
  <line x1="240" y1="132" x2="390" y2="132" stroke="#2c3750" stroke-width="2"/><line x1="580" y1="132" x2="730" y2="132" stroke="#2c3750" stroke-width="2"/>
  <g class="k1"><circle cx="240" cy="132" r="6" fill="#ffb900"/></g>
  <g class="k2"><circle cx="580" cy="132" r="6" fill="#00a4ef"/></g><g class="k3"><circle cx="580" cy="132" r="6" fill="#00a4ef"/></g><g class="k4"><circle cx="580" cy="132" r="6" fill="#00a4ef"/></g>
  <text x="315" y="124" text-anchor="middle" font-size="10" class="muted">app-only token</text><text x="655" y="124" text-anchor="middle" font-size="10" class="muted">Bearer calls</text>
  <text x="30" y="186" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">TOOL AREAS · APPLICATION PERMISSIONS · ✎ = CHANGES THINGS</text>
  <g class="g0"><rect x="30" y="196" width="219" height="276" rx="12" fill="#00a4ef" fill-opacity=".07" stroke="#00a4ef" stroke-opacity=".55"/><text x="44" y="222" font-size="15" font-weight="700">Users</text><text x="235" y="223" text-anchor="end" font-size="17" font-weight="800" style="fill:#00a4ef">4</text><text x="44" y="246" font-size="10.5" class="mono" style="fill:#00a4ef">create_user ✎</text><text x="44" y="264" font-size="10.5" class="mono" style="fill:#00a4ef">get_user</text><text x="44" y="282" font-size="10.5" class="mono" style="fill:#00a4ef">search_user</text><text x="44" y="300" font-size="10.5" class="mono" style="fill:#00a4ef">list_users</text><rect x="40" y="420" width="199" height="42" rx="8" fill="#0b0f18" stroke="#00a4ef" stroke-opacity=".5"/><text x="50" y="438" font-size="10.5" font-weight="700" class="mono">User.ReadWrite.All</text><text x="50" y="454" font-size="9.5" class="muted">read-only: User.Read.All</text></g><g class="g1"><rect x="257" y="196" width="219" height="276" rx="12" fill="#ffb900" fill-opacity=".07" stroke="#ffb900" stroke-opacity=".55"/><text x="271" y="222" font-size="15" font-weight="700">Licenses</text><text x="462" y="223" text-anchor="end" font-size="17" font-weight="800" style="fill:#ffb900">2</text><text x="271" y="246" font-size="10.5" class="mono" style="fill:#ffb900">list_available_licenses</text><text x="271" y="264" font-size="10.5" class="mono" style="fill:#ffb900">assign_license ✎</text><rect x="267" y="420" width="199" height="42" rx="8" fill="#0b0f18" stroke="#ffb900" stroke-opacity=".5"/><text x="277" y="438" font-size="10.5" font-weight="700" class="mono">Organization.Read.All</text><text x="277" y="454" font-size="9.5" class="muted">+ User.ReadWrite.All to assign</text></g><g class="g2"><rect x="484" y="196" width="219" height="276" rx="12" fill="#7fba00" fill-opacity=".07" stroke="#7fba00" stroke-opacity=".55"/><text x="498" y="222" font-size="15" font-weight="700">Groups</text><text x="689" y="223" text-anchor="end" font-size="17" font-weight="800" style="fill:#7fba00">4</text><text x="498" y="246" font-size="10.5" class="mono" style="fill:#7fba00">list_groups</text><text x="498" y="264" font-size="10.5" class="mono" style="fill:#7fba00">get_group_members</text><text x="498" y="282" font-size="10.5" class="mono" style="fill:#7fba00">add_user_to_group ✎</text><text x="498" y="300" font-size="10.5" class="mono" style="fill:#7fba00">remove_user_from_group ✎</text><rect x="494" y="420" width="199" height="42" rx="8" fill="#0b0f18" stroke="#7fba00" stroke-opacity=".5"/><text x="504" y="438" font-size="10.5" font-weight="700" class="mono">Group.ReadWrite.All</text><text x="504" y="454" font-size="9.5" class="muted">read-only: Group.Read.All</text></g><g class="g3"><rect x="711" y="196" width="219" height="276" rx="12" fill="#f25022" fill-opacity=".07" stroke="#f25022" stroke-opacity=".55"/><text x="725" y="222" font-size="15" font-weight="700">SharePoint</text><text x="916" y="223" text-anchor="end" font-size="17" font-weight="800" style="fill:#f25022">9</text><text x="725" y="246" font-size="10.5" class="mono" style="fill:#f25022">list_sites</text><text x="725" y="264" font-size="10.5" class="mono" style="fill:#f25022">get_site</text><text x="725" y="282" font-size="10.5" class="mono" style="fill:#f25022">get_site_by_url</text><text x="725" y="300" font-size="10.5" class="mono" style="fill:#f25022">get_root_site</text><text x="725" y="318" font-size="10.5" class="mono" style="fill:#f25022">list_site_drives</text><text x="725" y="336" font-size="10.5" class="mono" style="fill:#f25022">list_site_lists</text><text x="725" y="354" font-size="10.5" class="mono" style="fill:#f25022">list_site_permissions</text><text x="725" y="372" font-size="10.5" class="mono" style="fill:#f25022">add_site_permission ✎</text><text x="725" y="390" font-size="10.5" class="mono" style="fill:#f25022">remove_site_permission ✎</text><rect x="721" y="420" width="199" height="42" rx="8" fill="#0b0f18" stroke="#f25022" stroke-opacity=".5"/><text x="731" y="438" font-size="10.5" font-weight="700" class="mono">Sites.Read.All</text><text x="731" y="454" font-size="9.5" class="muted">+ Sites.FullControl.All for permissions</text></g>
</svg>
